<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن وإدارة الاشتراكات</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 15px; direction: rtl; }
        h1, h2, h3 { color: #38bdf8; text-align: center; margin-top: 0; }
        .container { max-width: 950px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #cbd5e1; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
        .btn { padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; margin-top: 5px; }
        .btn-green { background: #22c55e; color: white; }
        .btn-blue { background: #0284c7; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-orange { background: #f97316; color: white; }
        .btn-purple { background: #8b5cf6; color: white; }
        .btn-indigo { background: #6366f1; color: white; }
        .btn:hover { opacity: 0.9; }
        .flex-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .flex-group > * { flex: 1; min-width: 140px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 8px; overflow: hidden; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #38bdf8; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-active { background: #166534; color: #4ade80; }
        .badge-disabled { background: #991b1b; color: #fca5a5; }
        code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
        .history-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-top: 10px; max-height: 200px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 لوحة تحكم الأدمن والاشتراكات المباشرة</h1>

    <!-- 🎁 قسم إرسال دعوة تجربة التطبيق -->
    <div class="card">
        <h3>🎁 إرسال دعوة تجربة التطبيق لعميل جديد</h3>
        <label>اسم العميل / المحل المرشح للتجربة:</label>
        <input type="text" id="trialClientName" placeholder="مثال: محلات الأمانة">

        <label>رقم هاتف العميل (اختياري):</label>
        <input type="text" id="trialClientPhone" placeholder="مثال: 201012345678">

        <label>مدة الفترة التجريبية (بالأيام):</label>
        <input type="number" id="trialDays" value="3">

        <div class="flex-group">
            <button class="btn btn-purple" onclick="sendTrialWhatsApp()">💬 إرسال طلب التجربة عبر واتساب</button>
            <button class="btn btn-blue" onclick="shareTrialViaMedia()">📲 مشاركة طلب التجربة عبر الوسائط</button>
        </div>
    </div>

    <!-- 1️⃣ نافذة تفعيل وتجديد الاشتراك والتأكيد -->
    <div class="card" id="activationCard">
        <h3>🔑 تفعيل / تجديد اشتراك العميل وتخصيص الاسم (Firebase)</h3>
        <label>كود جهاز العميل (Device ID):</label>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="targetDevId" placeholder="مثال: DEV-455618" style="flex: 1;">
            <button class="btn btn-blue" onclick="generateCode()" style="margin-top:0;">توليد كود</button>
        </div>

        <label>اسم صاحب الاشتراك / العميل:</label>
        <input type="text" id="clientName" placeholder="مثال: السيد متولي">

        <label>🏪 اسم النشاط / المحل (يظهر ثابتًا بداخل الشريط الدعائي للعميل):</label>
        <input type="text" id="storeName" placeholder="مثال: سوبرماركت أولاد علي">

        <label>رقم هاتف الواتساب:</label>
        <input type="text" id="clientPhone" placeholder="مثال: 201012345678">

        <label>مدة الاشتراك الجديدة (بالأيام):</label>
        <input type="number" id="subDays" value="30">

        <label>ملاحظات العميل / سجل التجديد:</label>
        <input type="text" id="clientNotes" placeholder="مثال: تم تحويل المبلغ عبر فودافون كاش">

        <div class="flex-group">
            <button class="btn btn-green" onclick="confirmAndActivateClient()">✅ مفتاح تأكيد التفعيل وتحديث بيانات العميل</button>
            <button class="btn btn-orange" onclick="sendActivationWhatsApp()">💬 إرسال الكود عبر الواتساب</button>
            <button class="btn btn-red" onclick="deactivateDevice()">🚫 إيقاف / حظر الجهاز</button>
        </div>
    </div>

    <!-- 2️⃣ التحكم في الشريط الدعائي العام -->
    <div class="card">
        <h3>📢 التحكم في الشريط الدعائي العام (Firebase)</h3>
        <label>نص الإعلان أو الرسالة الترحيبية لجميع العملاء (يُعرض بجانب اسم محل العميل):</label>
        <textarea id="promoInput" rows="2" placeholder="أدخل النص الدعائي هنا..."></textarea>
        <button class="btn btn-purple" onclick="updatePromoText()" style="width: 100%;">🚀 نشر الشريط الدعائي للجميع عبر السيرفر</button>
    </div>

    <!-- 3️⃣ قائمة العملاء والأجهزة المسجلة مع إمكانية التجديد والحذف -->
    <div class="card">
        <h3>📋 قائمة العملاء والأجهزة المسجلة</h3>
        <button class="btn btn-indigo" onclick="loadRegisteredDevices()" style="width: 100%; margin-bottom: 12px;">🔄 تحديث البيانات من السيرفر</button>
        <div id="devicesList" style="overflow-x: auto;">جاري جلب البيانات...</div>
    </div>

    <!-- 4️⃣ سجل تعاملات عميل محدد -->
    <div class="card" id="historyCard" style="display: none;">
        <h3 id="historyTitle">📜 سجل تعاملات العميل</h3>
        <div id="historyContent" class="history-box"></div>
    </div>

    <!-- 5️⃣ روابط الدعم والجروبات -->
    <div class="card">
        <h3>🔗 روابط الدعم والجروبات الرسمية</h3>
        <label>رابط جروب الواتساب للعملاء:</label>
        <input type="text" id="whatsappGroupUrl" placeholder="https://chat.whatsapp.com/...">

        <label>رابط صفحة أو جروب الماسنجر:</label>
        <input type="text" id="messengerGroupUrl" placeholder="https://m.me/...">

        <div class="flex-group">
            <button class="btn btn-green" onclick="saveGroupLinks()">💾 حفظ الروابط</button>
            <button class="btn btn-purple" onclick="shareGroupInvitation()">📤 إرسال دعوة الجروب عبر الوسائط</button>
        </div>
    </div>
</div>

<script>
    const FIREBASE_DB_URL = "https://pos-system-f3265-default-rtdb.firebaseio.com";
    let loadedDevicesData = {};

    document.addEventListener('DOMContentLoaded', () => {
        loadCurrentPromoText();
        loadRegisteredDevices();
        if(localStorage.getItem('link_wa_group')) document.getElementById('whatsappGroupUrl').value = localStorage.getItem('link_wa_group');
        if(localStorage.getItem('link_ms_group')) document.getElementById('messengerGroupUrl').value = localStorage.getItem('link_ms_group');
    });

    function generateCode() {
        const randomNum = Math.floor(100000 + Math.random() * 900000);
        document.getElementById('targetDevId').value = 'DEV-' + randomNum;
    }

    async function loadCurrentPromoText() {
        try {
            const res = await fetch(`${FIREBASE_DB_URL}/settings/promoText.json`);
            const text = await res.json();
            if (text) document.getElementById('promoInput').value = text;
        } catch (e) {}
    }

    async function updatePromoText() {
        const text = document.getElementById('promoInput').value.trim();
        if (!text) return alert('⚠️ أدخل نص الإعلان أولاً!');
        try {
            await fetch(`${FIREBASE_DB_URL}/settings/promoText.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(text)
            });
            alert('✅ تم نشر الشريط الدعائي العام بنجاح!');
        } catch (e) {
            alert('❌ خطأ في الاتصال: ' + e.message);
        }
    }

    // --- تأكيد وتفعيل الاشتراك للعميل وتخصيص اسم نشاطه ---
    async function confirmAndActivateClient() {
        const devId = document.getElementById('targetDevId').value.trim();
        const clientName = document.getElementById('clientName').value.trim();
        const storeName = document.getElementById('storeName').value.trim();
        const clientPhone = document.getElementById('clientPhone').value.trim();
        const days = parseInt(document.getElementById('subDays').value) || 30;
        const notes = document.getElementById('clientNotes').value.trim();

        if (!devId) return alert('⚠️ يرجى إدخال كود جهاز العميل (Device ID)!');

        const now = new Date();
        const expireDate = now.getTime() + (days * 86400000);
        const dateStr = now.toLocaleDateString('ar-EG');

        // جلب البيانات القديمة للسجل إذا كان العميل موجوداً
        let firstActive = dateStr;
        let logs = [];
        if (loadedDevicesData[devId]) {
            firstActive = loadedDevicesData[devId].firstActive || dateStr;
            logs = loadedDevicesData[devId].logs || [];
        }

        logs.push({
            date: dateStr,
            days: days,
            notes: notes || 'تجديد/تفعيل اشتراك وتحديث اسم المحل'
        });

        const payload = {
            active: true,
            clientName: clientName || 'عميل غير مسمى',
            storeName: storeName || clientName || 'محل تجاري',
            phone: clientPhone || '',
            expireDate: expireDate,
            firstActive: firstActive,
            lastRenewal: dateStr,
            notes: notes,
            logs: logs
        };

        try {
            await fetch(`${FIREBASE_DB_URL}/devices/${devId}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            alert(`✅ تم التفعيل وتحديث بيانات العميل بنجاح!\nالعميل: ${clientName || devId}\nاسم المحل: ${storeName || 'غير مخصص'}\nالمدة: ${days} يوم.`);
            document.getElementById('clientNotes').value = '';
            loadRegisteredDevices();
        } catch (e) {
            alert('❌ خطأ أثناء التفعيل: ' + e.message);
        }
    }

    // --- حذف العميل نهائياً لتفريغ المساحة ---
    async function deleteClient(devId) {
        if (confirm(`⚠️ هل أنت متأكد من حذف العميل صاحب الكود (${devId}) نهائياً لتفريغ مساحة القائمة؟`)) {
            try {
                await fetch(`${FIREBASE_DB_URL}/devices/${devId}.json`, {
                    method: 'DELETE'
                });
                alert(`🗑️ تم حذف العميل وتفريغ المساحة بنجاح!`);
                loadRegisteredDevices();
            } catch (e) {
                alert('❌ خطأ أثناء الحذف: ' + e.message);
            }
        }
    }

    // --- إيقاف / حظر الجهاز ---
    async function deactivateDevice() {
        const devId = document.getElementById('targetDevId').value.trim();
        if (!devId) return alert('⚠️ أدخل كود الجهاز أولاً!');

        if (confirm(`هل أنت متأكد من إيقاف/حظر الجهاز (${devId})؟`)) {
            try {
                await fetch(`${FIREBASE_DB_URL}/devices/${devId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ active: false })
                });
                alert(`✅ تم إيقاف الجهاز (${devId}) بنجاح!`);
                loadRegisteredDevices();
            } catch (e) {
                alert('❌ خطأ أثناء الإيقاف: ' + e.message);
            }
        }
    }

    // --- جلب وإظهار قائمة العملاء في الجدول ---
    async function loadRegisteredDevices() {
        const container = document.getElementById('devicesList');
        container.innerHTML = 'جاري التحميل...';

        try {
            const res = await fetch(`${FIREBASE_DB_URL}/devices.json`);
            const data = await res.json();
            loadedDevicesData = data || {};

            if (!data) {
                container.innerHTML = '<p style="text-align:center; padding:10px;">لا يوجد عملاء مسجلين حالياً على السيرفر.</p>';
                return;
            }

            let html = '<table><thead><tr><th>كود الجهاز</th><th>اسم العميل</th><th>اسم المحل/النشاط</th><th>الهاتف</th><th>الحالة</th><th>الأيام</th><th>التحكم والإجراءات</th></tr></thead><tbody>';
            const now = new Date().getTime();

            for (let devId in data) {
                const dev = data[devId];
                const isActive = dev.active;
                const diff = (dev.expireDate || 0) - now;
                const remainingDays = Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));

                let statusBadge = isActive && remainingDays > 0 
                    ? '<span class="badge badge-active">🟢 مفعل</span>' 
                    : '<span class="badge badge-disabled">🔴 معطل / منتهي</span>';

                html += `<tr>
                    <td><code>${devId}</code></td>
                    <td><b>${dev.clientName || '-'}</b></td>
                    <td><span style="color:#38bdf8; font-weight:bold;">${dev.storeName || dev.clientName || '-'}</span></td>
                    <td>${dev.phone || '-'}</td>
                    <td>${statusBadge}</td>
                    <td>${remainingDays} يوم</td>
                    <td>
                        <button class="btn btn-green" style="padding:4px 8px; font-size:11px;" onclick="prepareRenewal('${devId}')">🔄 تجديد/تعديل</button>
                        <button class="btn btn-purple" style="padding:4px 8px; font-size:11px;" onclick="showHistory('${devId}')">📜 السجل</button>
                        <button class="btn btn-red" style="padding:4px 8px; font-size:11px;" onclick="deleteClient('${devId}')">🗑️ حذف</button>
                    </td>
                </tr>`;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (e) {
            container.innerHTML = '<p style="color:#ef4444; text-align:center;">❌ فشل جلب البيانات من السيرفر.</p>';
        }
    }

    // --- الاستجابة لطلب تجديد الاشتراك واظهار البيانات للتحكم ---
    function prepareRenewal(devId) {
        const dev = loadedDevicesData[devId];
        if (!dev) return;

        document.getElementById('targetDevId').value = devId;
        document.getElementById('clientName').value = dev.clientName || '';
        document.getElementById('storeName').value = dev.storeName || dev.clientName || '';
        document.getElementById('clientPhone').value = dev.phone || '';
        document.getElementById('clientNotes').value = dev.notes || '';

        document.getElementById('activationCard').scrollIntoView({ behavior: 'smooth' });
    }

    // --- عرض سجل تعاملات العميل والملاحظات ---
    function showHistory(devId) {
        const dev = loadedDevicesData[devId];
        if (!dev) return;

        const historyCard = document.getElementById('historyCard');
        const historyTitle = document.getElementById('historyTitle');
        const historyContent = document.getElementById('historyContent');

        historyTitle.innerText = `📜 سجل تعاملات العميل: ${dev.clientName || devId}`;
        
        let html = `<p><b>اسم النشاط/المحل:</b> ${dev.storeName || 'غير مخصص'}</p>`;
        html += `<p><b>تاريخ أول تعامل:</b> ${dev.firstActive || 'غير محدد'}</p>`;
        html += `<p><b>رقم الهاتف:</b> ${dev.phone || 'غير مدخل'}</p>`;
        html += `<p><b>آخر ملاحظة:</b> ${dev.notes || 'لا يوجد'}</p><hr style="border-color:#334155;">`;
        
        html += `<b>سجل التجديدات والتعديلات السابقة:</b><ul>`;
        if (dev.logs && dev.logs.length > 0) {
            dev.logs.forEach(log => {
                html += `<li>التاريخ: <b>${log.date}</b> | المدة: <b>${log.days} يوم</b> | التفاصيل: ${log.notes}</li>`;
            });
        } else {
            html += `<li>لا يوجد سجل تجديدات سابق.</li>`;
        }
        html += `</ul>`;

        historyContent.innerHTML = html;
        historyCard.style.display = 'block';
        historyCard.scrollIntoView({ behavior: 'smooth' });
    }

    function sendActivationWhatsApp() {
        const phone = document.getElementById('clientPhone').value;
        const devId = document.getElementById('targetDevId').value;
        const days = document.getElementById('subDays').value;
        const storeName = document.getElementById('storeName').value;

        if (!phone || !devId) { alert("⚠️ يرجى إدخال رقم الهاتف وكود الجهاز!"); return; }

        const msg = encodeURIComponent(`مرحباً بك! 🌹\nتم تفعيل/تجديد حسابك بنجاح على النظام المحاسبي.\n🏪 اسم النشاط: ${storeName || 'مفعل'}\n🔑 كود التفعيل الخاص بك: ${devId}\n⏳ مدة الاشتراك: ${days} يوم.`);
        window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    function generateTrialMessage() {
        const name = document.getElementById('trialClientName').value || "عزيزنا العميل";
        const days = document.getElementById('trialDays').value || "3";
        const trialCode = "TRIAL-" + Math.floor(1000 + Math.random() * 9000);
        return `أهلاً بك أ/ ${name} 💐\nندعوك لتجربة تطبيقنا المحاسبي مجاناً لمدة (${days}) أيام!\n\n🔑 كود التجربة المجاني: ${trialCode}\n📲 يمكنك البدء فوراً وتجربة كافة المميزات.`;
    }

    function sendTrialWhatsApp() {
        const phone = document.getElementById('trialClientPhone').value;
        const text = generateTrialMessage();
        if (!phone) { alert("⚠️ يرجى إدخال رقم هاتف العميل!"); return; }
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function shareTrialViaMedia() {
        const text = generateTrialMessage();
        if (navigator.share) {
            navigator.share({ title: 'دعوة لتجربة التطبيق المحاسبي', text: text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            alert("📋 تم نسخ نص الدعوة التجريبية!");
        }
    }

    function saveGroupLinks() {
        const wa = document.getElementById('whatsappGroupUrl').value;
        const ms = document.getElementById('messengerGroupUrl').value;
        localStorage.setItem('link_wa_group', wa);
        localStorage.setItem('link_ms_group', ms);
        alert("💾 تم حفظ روابط المجموعات بنجاح!");
    }

    function shareGroupInvitation() {
        const waGroup = document.getElementById('whatsappGroupUrl').value || localStorage.getItem('link_wa_group') || '';
        const msGroup = document.getElementById('messengerGroupUrl').value || localStorage.getItem('link_ms_group') || '';

        if (!waGroup && !msGroup) { alert("⚠️ يرجى إدخال رابط جروب الواتساب أو الماسنجر أولاً!"); return; }

        let message = `مرحباً بك! 👋\nندعوك للانضمام إلى مجموعة الدعم والتحديثات الخاصة بتطبيقنا المحاسبي:\n\n`;
        if (waGroup) message += `🟢 جروب الواتساب:\n${waGroup}\n\n`;
        if (msGroup) message += `🔵 جروب الماسنجر:\n${msGroup}\n\n`;

        if (navigator.share) {
            navigator.share({ title: 'دعوة للانضمام لمجموعة التطبيق', text: message }).catch(() => {});
        } else {
            navigator.clipboard.writeText(message);
            alert("📋 تم نسخ رسالة الدعوة والرابط!");
        }
    }
</script>

</body>
</html>

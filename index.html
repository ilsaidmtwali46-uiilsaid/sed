<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المبيعات والجرد الشامل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 15px; }

        .activation-container {
            max-width: 450px; margin: 40px auto; background: var(--card-bg);
            padding: 25px; border-radius: 20px; text-align: center; border: 1px solid var(--border-color);
        }
        .dev-box {
            background: #090d16; padding: 12px; border-radius: 10px; color: var(--accent-blue);
            font-size: 18px; font-weight: bold; margin: 15px 0; border: 1px dashed var(--accent-blue);
        }

        .input-field, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color);
            background: #090d16; color: #fff; font-size: 14px; margin-bottom: 10px; outline: none;
        }

        .btn-action {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            background: var(--accent-green); color: #fff; font-size: 15px; font-weight: bold;
            cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        .btn-action:active { transform: scale(0.98); opacity: 0.9; }

        .app-dashboard { display: none; max-width: 1100px; margin: 0 auto; }
        .header-bar {
            background: var(--card-bg); padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .subscription-badge {
            background: rgba(34, 197, 94, 0.15); color: var(--accent-green);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--accent-green);
        }

        .section-title { color: var(--accent-gold); font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .services-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }
        .service-card {
            background: var(--card-bg); padding: 15px 10px; border-radius: 14px;
            text-align: center; border: 1px solid var(--border-color); cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .service-card:hover { border-color: var(--accent-blue); background: #253346; }
        .service-card i { font-size: 24px; }
        .service-card span { font-size: 13px; font-weight: 600; }

        .workspace {
            background: var(--card-bg); padding: 20px; border-radius: 16px;
            border: 1px solid var(--border-color); display: none; margin-top: 15px;
        }
        .workspace-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .close-btn { background: var(--danger-color); color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #090d16; border-radius: 8px; overflow: hidden; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        th { background: #151f32; color: var(--accent-gold); }
    </style>
</head>
<body>

    <!-- شاشة التفعيل -->
    <div id="activationScreen" class="activation-container">
        <h2 style="color: var(--accent-gold);"><i class="fa-solid fa-lock"></i> تفعيل النظام</h2>
        <p style="color: var(--text-sub); font-size: 13px;">أدخل كود التفعيل الممنوح لك من الأدمن</p>
        <div class="dev-box">DEV-439766</div>
        <input type="text" id="licenseInput" class="input-field" placeholder="أدخل كود التفعيل هنا">
        <button class="btn-action" onclick="validateKey()">تفعيل التطبيق</button>
        <p id="activationStatus" style="margin-top: 15px; font-size: 13px; font-weight: bold;"></p>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="appDashboard" class="app-dashboard">
        <div class="header-bar">
            <div>
                <h3 style="color: var(--accent-gold);"><i class="fa-solid fa-store"></i> متجر البركة والخيرات</h3>
                <span style="font-size: 12px; color: var(--text-sub);">DEV-439766</span>
            </div>
            <div class="subscription-badge">
                <i class="fa-solid fa-shield-halved"></i> متبقي <b id="daysLeft">--</b> يوم
            </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-gauge-high"></i> الواجهات الأساسية</div>
        <div class="services-grid">
            <div class="service-card" onclick="openWorkspace('بيع')">
                <i class="fa-solid fa-cart-shopping" style="color: #4ade80;"></i>
                <span>شاشة البيع</span>
            </div>
            <div class="service-card" onclick="openWorkspace('جرد')">
                <i class="fa-solid fa-boxes-stacked" style="color: #38bdf8;"></i>
                <span>المخزن والجرد</span>
            </div>
            <div class="service-card" onclick="openWorkspace('شراء')">
                <i class="fa-solid fa-bag-shopping" style="color: #f43f5e;"></i>
                <span>الشراء والتركيدات</span>
            </div>
            <div class="service-card" onclick="openWorkspace('شحن')">
                <i class="fa-solid fa-mobile-screen-button" style="color: #fbbf24;"></i>
                <span>شحن رصيد</span>
            </div>
            <div class="service-card" onclick="openWorkspace('عملاء')">
                <i class="fa-solid fa-users" style="color: #f472b6;"></i>
                <span>إدارة العملاء</span>
            </div>
            <div class="service-card" onclick="openWorkspace('نقدية')">
                <i class="fa-solid fa-vault" style="color: #a78bfa;"></i>
                <span>معاملات نقدية</span>
            </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-credit-card"></i> المعاملات المتقدمة والربط</div>
        <div class="services-grid">
            <div class="service-card" onclick="openWorkspace('فيزا')">
                <i class="fa-solid fa-credit-card" style="color: #60a5fa;"></i>
                <span>دفع فيزا</span>
            </div>
            <div class="service-card" onclick="openWorkspace('محفظة')">
                <i class="fa-solid fa-wallet" style="color: #34d399;"></i>
                <span>محفظة كاش</span>
            </div>
            <div class="service-card" onclick="openWorkspace('بنك')">
                <i class="fa-solid fa-building-columns" style="color: #f87171;"></i>
                <span>معاملات بنكية</span>
            </div>
            <div class="service-card" onclick="openWorkspace('فوري')">
                <i class="fa-solid fa-network-wired" style="color: #facc15;"></i>
                <span>شبكة فوري</span>
            </div>
        </div>

        <!-- منطقة العمل والتفاعل -->
        <div id="workspace" class="workspace">
            <div class="workspace-header">
                <h3 id="workspaceTitle" style="color: var(--accent-gold);">عنوان الواجهة</h3>
                <button class="close-btn" onclick="closeWorkspace()">إغلاق <i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="workspaceBody"></div>
        </div>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('app_inventory')) || [
            { id: 101, name: "منتج تجريبي 1", price: 50, qty: 20 },
            { id: 102, name: "منتج تجريبي 2", price: 120, qty: 8 }
        ];

        let salesHistory = JSON.parse(localStorage.getItem('app_sales')) || [];

        window.onload = function() { checkSubscriptionStatus(); };

        function checkSubscriptionStatus() {
            const expiryDateStr = localStorage.getItem('app_expiry_date');
            if (expiryDateStr) {
                const expiryDate = new Date(expiryDateStr);
                const diffDays = Math.ceil((expiryDate - new Date()) / (1000 * 60 * 60 * 24));
                if (diffDays > 0) { showAppScreen(diffDays); }
                else { showActivationScreen(); }
            } else { showActivationScreen(); }
        }

        function validateKey() {
            const key = document.getElementById('licenseInput').value.trim();
            let durationDays = 0;
            if (key === "KEY-30DAYS-439766") durationDays = 30;
            else if (key === "KEY-365DAYS-439766") durationDays = 365;
            else if (key === "123") durationDays = 3650;

            if (durationDays > 0) {
                let expiryDate = new Date();
                expiryDate.setDate(expiryDate.getDate() + durationDays);
                localStorage.setItem('app_expiry_date', expiryDate.toISOString());
                showAppScreen(durationDays);
            } else {
                const status = document.getElementById('activationStatus');
                status.innerText = "كود التفعيل غير صالح!";
                status.style.color = "#ef4444";
            }
        }

        function showAppScreen(days) {
            document.getElementById('activationScreen').style.display = 'none';
            document.getElementById('appDashboard').style.display = 'block';
            document.getElementById('daysLeft').innerText = days;
        }

        function showActivationScreen() {
            document.getElementById('activationScreen').style.display = 'block';
            document.getElementById('appDashboard').style.display = 'none';
        }

        function openWorkspace(type) {
            const ws = document.getElementById('workspace');
            const title = document.getElementById('workspaceTitle');
            const body = document.getElementById('workspaceBody');

            ws.style.display = 'block';
            ws.scrollIntoView({ behavior: 'smooth' });

            if (type === 'بيع') {
                title.innerText = "🛒 شاشة إدخال المبيعات";
                body.innerHTML = `
                    <label>اختر المنتج:</label>
                    <select id="sellProdSelect">
                        ${inventory.map(i => `<option value="${i.id}">${i.name} - المتبقي: (${i.qty}) - السعر: ${i.price} ج.م</option>`).join('')}
                    </select>
                    <label>الكمية المباعة:</label>
                    <input type="number" id="sellQty" class="input-field" value="1">
                    <button class="btn-action" onclick="executeSale()">إتمام البيع واستخراج الفاتورة</button>
                    
                    <h4 style="color: var(--accent-gold); margin-top: 15px;">سجل المبيعات الأخيرة</h4>
                    <table>
                        <tr><th>المنتج</th><th>الكمية</th><th>الإجمالي</th></tr>
                        ${salesHistory.slice(-5).reverse().map(s => `<tr><td>${s.name}</td><td>${s.qty}</td><td>${s.total} ج.م</td></tr>`).join('')}
                    </table>
                `;
            } else if (type === 'جرد') {
                title.innerText = "📦 إدارة الجرد والمنتجات";
                body.innerHTML = `
                    <h4 style="color: var(--accent-blue); margin-bottom: 8px;">إضافة صنف جديد للمخزن</h4>
                    <input type="text" id="newProdName" class="input-field" placeholder="اسم المنتج">
                    <input type="number" id="newProdPrice" class="input-field" placeholder="سعر البيع">
                    <input type="number" id="newProdQty" class="input-field" placeholder="الكمية الأولى">
                    <button class="btn-action" style="background: var(--accent-blue);" onclick="addProduct()">حفظ المنتج في الجرد</button>
                    
                    <h4 style="color: var(--accent-gold); margin: 15px 0 8px;">جدول جرد المخزن الحالي</h4>
                    <table>
                        <tr><th>الكود</th><th>المنتج</th><th>الكمية</th><th>السعر</th></tr>
                        ${inventory.map(i => `<tr><td>${i.id}</td><td>${i.name}</td><td>${i.qty}</td><td>${i.price} ج.م</td></tr>`).join('')}
                    </table>
                `;
            } else {
                title.innerText = "⚡ قسم: " + type;
                body.innerHTML = `
                    <p style="margin-bottom: 10px;">إدخال حركة جديدة في قسم <b>${type}</b>:</p>
                    <input type="text" id="actionName" class="input-field" placeholder="اسم العميل / الجهة / المورد">
                    <input type="number" id="actionAmount" class="input-field" placeholder="المبلغ">
                    <textarea id="actionNote" class="input-field" placeholder="ملاحظات تفصيلية"></textarea>
                    <button class="btn-action" onclick="saveGeneralAction('${type}')">حفظ وإثبات العملية</button>
                `;
            }
        }

        function addProduct() {
            const name = document.getElementById('newProdName').value;
            const price = parseFloat(document.getElementById('newProdPrice').value);
            const qty = parseInt(document.getElementById('newProdQty').value);

            if (name && price && qty) {
                inventory.push({ id: Math.floor(100 + Math.random() * 900), name, price, qty });
                localStorage.setItem('app_inventory', JSON.stringify(inventory));
                alert("تم إضافة المنتج للمخزن بنجاح!");
                openWorkspace('جرد');
            } else { alert("يرجى إدخال جميع الحقول بشكل صحيح!"); }
        }

        function executeSale() {
            const prodId = parseInt(document.getElementById('sellProdSelect').value);
            const qty = parseInt(document.getElementById('sellQty').value);
            const item = inventory.find(i => i.id === prodId);

            if (item && item.qty >= qty) {
                item.qty -= qty;
                const total = item.price * qty;
                salesHistory.push({ name: item.name, qty, total, date: new Date().toLocaleTimeString('ar-EG') });
                
                localStorage.setItem('app_inventory', JSON.stringify(inventory));
                localStorage.setItem('app_sales', JSON.stringify(salesHistory));
                
                alert(`تم إتمام العملية بنجاح! الإجمالي: ${total} ج.م`);
                openWorkspace('بيع');
            } else {
                alert("الكمية المطلوبة غير متوفرة في المخزن!");
            }
        }

        function saveGeneralAction(type) {
            const name = document.getElementById('actionName').value;
            const amount = document.getElementById('actionAmount').value;
            if (name && amount) {
                alert(`تم تسجيل عملية (${type}) بمبلغ ${amount} ج.م بنجاح!`);
                closeWorkspace();
            } else { alert("يرجى إدخال البيانات المطلوبة!"); }
        }

        function closeWorkspace() { document.getElementById('workspace').style.display = 'none'; }
    </script>
</body>
</html>

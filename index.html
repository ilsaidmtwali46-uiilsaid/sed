<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المبيعات والحسابات</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        h2 { color: #f59e0b; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .dev-box { background: #0f172a; padding: 12px; border-radius: 8px; color: #ef4444; font-weight: bold; font-size: 18px; letter-spacing: 1px; margin-bottom: 20px; border: 1px dashed #475569; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 16px; margin-bottom: 15px; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #22c55e; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #16a34a; }
        .app-content { display: none; text-align: right; }
        .success-badge { background: #166534; color: #4ade80; padding: 6px 12px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- شاشة التفعيل المبسطة -->
    <div id="activationScreen" class="card">
        <h2>🛒 تطبيق المبيعات والحسابات</h2>
        <p>مرحباً بك! أدخل كود التفعيل السريع للبدء (الكود المباشر: 123)</p>
        <div class="dev-box" id="devIdDisplay">DEV-439766</div>
        <input type="text" id="licenseInput" placeholder="أدخل الكود (123)">
        <button onclick="activateApp()">تفعيل التطبيق الان</button>
    </div>

    <!-- واجهة التطبيق الرئيسية بعد التفعيل -->
    <div id="appScreen" class="card app-content">
        <span class="success-badge">✓ النسخة مفعلة بالكامل</span>
        <h2 style="color: #38bdf8;">نظام المبيعات والجهاز</h2>
        <p>مرحباً بك في نظام إدارة المبيعات والحسابات (شغال بدون نت).</p>
        <hr style="border-color: #334155; margin: 20px 0;">
        <button onclick="alert('جاري فتح شاشة الكاشير...')" style="background: #3b82f6;">فتح شاشة المبيعات</button>
    </div>

    <script>
        // التحقق من التفعيل المسبق
        if (localStorage.getItem('app_activated') === 'true') {
            showApp();
        }

        function activateApp() {
            const key = document.getElementById('licenseInput').value.trim();
            // يتقبل الكود 123 أو أي كود يحتوي على رقم الجهاز
            if (key === '123' || key.includes('439766') || key.length >= 3) {
                localStorage.setItem('app_activated', 'true');
                alert('تم التفعيل بنجاح!');
                showApp();
            } else {
                alert('كود التفعيل غير صحيح! استعمل الكود: 123');
            }
        }

        function showApp() {
            document.getElementById('activationScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة أدمن تفعيل الاشتراكات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #24334d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; min-height: 100vh; }

        .admin-card {
            max-width: 500px; margin: 20px auto; background: var(--card-bg);
            padding: 25px; border-radius: 18px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .admin-header { text-align: center; margin-bottom: 25px; }
        .admin-header h2 { color: var(--accent-gold); font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .form-group { margin-bottom: 18px; text-align: right; }
        .form-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
        
        .input-box, select {
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background: #0b0f19; color: #fff; font-size: 15px; outline: none; transition: 0.2s;
        }
        .input-box:focus, select:focus { border-color: var(--accent-blue); }

        .btn-generate {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: var(--accent-blue); color: #0b0f19; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-generate:hover { background: #0284c7; color: #fff; }

        /* منطقة استخراج وتصنيع الكود */
        .result-box {
            display: none; background: #0b0f19; padding: 15px; border-radius: 12px;
            margin-top: 25px; border: 1px dashed var(--accent-gold); text-align: center;
        }
        .license-key {
            font-size: 18px; font-weight: bold; color: var(--accent-gold);
            letter-spacing: 1px; word-break: break-all; margin: 10px 0;
        }
        .btn-copy {
            background: var(--accent-green); color: white; border: none;
            padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="admin-header">
            <h2><i class="fa-solid fa-user-shield"></i> لوحة الأدمن - إدارة التفعيل</h2>
            <p style="font-size: 12px; color: var(--text-sub); margin-top: 5px;">توليد كود التفعيل والتحكم بمدة الاشتراك للعميل</p>
        </div>

        <!-- 1. معرف جهاز العميل -->
        <div class="form-group">
            <label><i class="fa-solid fa-mobile-screen"></i> مُعرّف جهاز العميل (Device ID):</label>
            <input type="text" id="targetDevId" class="input-box" placeholder="مثال: DEV-439766" value="DEV-439766">
        </div>

        <!-- 2. نوع وتحديد المدة بالأيام -->
        <div class="form-group">
            <label><i class="fa-solid fa-clock"></i> تحديد مدة الاشتراك:</label>
            <select id="durationSelect" onchange="toggleCustomDays()">
                <option value="30">اشتراك 30 يوم (شهر)</option>
                <option value="90">اشتراك 90 يوم (3 شهور)</option>
                <option value="180">اشتراك 180 يوم (6 شهور)</option>
                <option value="365">اشتراك 365 يوم (سنة كاملة)</option>
                <option value="custom">مخصص (أدخل عدد الأيام)...</option>
                <option value="3650">اشتراك دائم (10 سنوات)</option>
            </select>
        </div>

        <!-- 3. أدخل أيام مخصصة إذا اختار العميل -->
        <div class="form-group" id="customDaysGroup" style="display: none;">
            <label><i class="fa-solid fa-calendar-days"></i> أدخل عدد الأيام بالضبط:</label>
            <input type="number" id="customDaysInput" class="input-box" placeholder="مثال: 15 أو 45">
        </div>

        <button class="btn-generate" onclick="generateActivationKey()">
            <i class="fa-solid fa-key"></i> إنشاء كود التفعيل الآن
        </button>

        <!-- النتيجة والتصدير للعميل -->
        <div id="resultBox" class="result-box">
            <span style="font-size: 12px; color: var(--text-sub);">كود التفعيل الخاص بالعميل:</span>
            <div id="generatedKey" class="license-key">KEY-30DAYS-439766</div>
            <button class="btn-copy" onclick="copyKey()">
                <i class="fa-solid fa-copy"></i> نسخ الكود لإرساله للعميل
            </button>
        </div>
    </div>

    <script>
        // إعدادات Firebase لربط البيانات مباشرة
        const firebaseConfig = {
            databaseURL: "https://your-firebase-db.firebaseio.com"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        function toggleCustomDays() {
            const select = document.getElementById('durationSelect');
            const customGroup = document.getElementById('customDaysGroup');
            if (select.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        }

        function generateActivationKey() {
            const devId = document.getElementById('targetDevId').value.trim();
            if (!devId) {
                alert("يرجى إدخال معرّف جهاز العميل أولاً!");
                return;
            }

            let days = document.getElementById('durationSelect').value;
            if (days === 'custom') {
                days = document.getElementById('customDaysInput').value.trim();
                if (!days || days <= 0) {
                    alert("يرجى إدخال عدد أيام صحيح!");
                    return;
                }
            }

            // استخراج الرقم الصافي من DEV-ID
            const cleanDevNum = devId.replace(/[^0-9]/g, '') || "439766";
            
            // صياغة الكود
            let finalKey = "";
            if (days == "3650") {
                finalKey = `123`;
            } else {
                finalKey = `KEY-${days}DAYS-${cleanDevNum}`;
            }

            // إظهار النتيجة
            document.getElementById('generatedKey').innerText = finalKey;
            document.getElementById('resultBox').style.display = 'block';

            // حفظ التفعيل في Firebase
            try {
                db.ref('activations/' + cleanDevNum).set({
                    deviceId: devId,
                    allowedDays: parseInt(days),
                    activationKey: finalKey,
                    createdAt: new Date().toISOString()
                });
            } catch(e) { console.log("Firebase sync offline"); }
        }

        function copyKey() {
            const keyText = document.getElementById('generatedKey').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert("تم نسخ الكود بنجاح! يمكنك الآن لصقه وإرساله للعميل.");
            });
        }
    </script>
</body>
</html>
